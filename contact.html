<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact — William Baker</title>
<meta name="description" content="Contact William Baker" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Hanken+Grotesk:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="icon" type="image/png" href="apple-touch-icon.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
</head>
<body>

  <header class="site-header">
    <a class="wordmark" href="index.html">William Baker</a>
    <a class="btn btn-ghost" href="index.html">Home</a>
  </header>

  <main>
    <div class="container">
      <h1 class="page-title">Contact</h1>
      <p class="page-sub">Enquiries and messages — leave a note below.</p>

      <!--
        TO RECEIVE MESSAGES: this form needs a form service (no email
        is sent on its own). Easiest option — Formspree (free):
        1. Sign up at formspree.io and create a form.
        2. Replace YOUR_FORM_ID below with the ID it gives you.
        Netlify hosting alternative: add  netlify  to the <form> tag
        and Netlify will collect submissions automatically.
      -->
      <form class="form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button class="btn btn-solid" type="submit">Send message</button>
      </form>
    </div>
  </main>

  <footer>&copy; 2026 William Baker</footer>

</body>
</html>
