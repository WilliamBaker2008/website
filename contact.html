<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact | William Baker</title>
<meta name="description" content="Contact William Baker" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../styles.css" />
<link rel="icon" type="image/png" href="../apple-touch-icon.png" />
<link rel="apple-touch-icon" href="../apple-touch-icon.png" />
</head>
<body>

  <header class="site-header">
    <span class="header-spacer" aria-hidden="true"></span>
    <a class="wordmark" href="/">William Baker</a>
    <div class="header-right">
      <a class="nav-link" href="/contact">Contact</a>
      <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
        <span></span><span></span><span></span>
      </button>
    </div>
    <nav class="mobile-menu" id="mobile-menu" aria-hidden="true">
      <a href="/contact">Contact</a>
    </nav>
  </header>

  <main>
    <div class="container">
      <h1 class="page-title">Contact</h1>
      <form class="form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
        <!-- Replace YOUR_FORM_ID above with your Formspree form ID to receive messages -->
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button class="send" type="submit">Send</button>
      </form>
    </div>
  </main>

  <footer>&copy; 2026 William Baker</footer>

<script>
(function(){
  var t=document.querySelector('.menu-toggle');
  var m=document.getElementById('mobile-menu');
  if(!t||!m)return;
  function close(){document.body.classList.remove('menu-open');t.setAttribute('aria-expanded','false');m.setAttribute('aria-hidden','true');}
  t.addEventListener('click',function(){
    var open=document.body.classList.toggle('menu-open');
    t.setAttribute('aria-expanded',open);
    m.setAttribute('aria-hidden',!open);
  });
  m.querySelectorAll('a').forEach(function(a){a.addEventListener('click',close);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
})();
</script>

</body>
</html>
